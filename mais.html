<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Codex - Mais</title>
   
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="celular-container">
       
         <header class="camera-header">

            <a href="configuracoes.html">
                <i class="bx bx-cog toggle-camera" style="color:#ffffff;"></i>
            </a>

            <button class="botao-icone">
                <i class="bx bx-bolt toggle-camera" style="color:#ffffff;"></i>
            </button>

            <button class="botao-icone">
                <i class="bx bx-timer toggle-camera" style="color:#ffffff;"></i>
            </button>
            <button class="botao-icone">
                <i class="bx bx-moon-star toggle-camera" style="color:#ffffff;"></i>
            </button>
            <button class="botao-icone toggle-camera">HDR</button>
        </header>

      
        <main class="foto-camera">
            <div class="overlay-modos">
                
                <div class="grade-modos">
                    <div class="modo-item">
                        <div class="icone-circulo"><i class="bx bx-move-horizontal" style="color:#ffffff;"></i></div>
                        <span>Panorâmica</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class="bx bx-file-detail" style="color:#ffffff;"></i></div>
                        <span>Documento</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class='bx bx-bowl-hot'></i></div>
                        <span>Comida</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class="bx bx-camcoder" style="color:#ffffff;"></i></div>
                        <span>Profissional</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class='bx bx-image-alt'></i></div>
                        <span>Alta Resolução</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class='bx bx-planet'></i></div>
                        <span>Astro</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class="bx bx-moon-crater" style="color:#ffffff;"></i></div>
                        <span>Superlua</span>
                    </div>
                    <div class="modo-item">
                        <div class="icone-circulo"><i class='bx bx-infinite'></i></div>
                        <span>Slow-Motion</span>
                    </div>
                </div>
            </div>
        </main>

       
        <footer class="camera-footer">
            <section class="modos-camera">
                <a href="video.html" class="link-modo">Vídeo</a>
                <a href="tela_inicial.html" class="link-modo">Foto</a>
                <span class="link-modo-ativo">Mais</span>
            </section>

            <nav class="barra-navegacao">
                <span><i class="bx bx-menu"></i></span>
                <span><i class="bx bx-square"></i></span>
                <span><i class="bx bx-chevron-left"></i></span>
            </nav>
        </footer>
    </div>
<script src="./js/script.js"></script>
</body>
</html>
