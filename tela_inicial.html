<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Codex - Foto</title>
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="celular-container">
    
        <header class="camera-header">

            <a href="configuracoes.html">
                <i class="bx bx-cog toggle-camera" style="color:#ffffff;"></i>
            </a>

            <button class="botao-icone">
                <i class="bx bx-bolt toggle-camera" style="color:#ffffff;"></i>
            </button>

            <button class="botao-icone">
                <i class="bx bx-timer toggle-camera" style="color:#ffffff;"></i>
            </button>
            <button class="botao-icone">
                <i class="bx bx-moon-star toggle-camera" style="color:#ffffff;"></i>
            </button>
            <button class="botao-icone toggle-camera">HDR</button>
        </header>

     
        <main class="foto-camera">
            
            <a href="feature.html" class="botao-funcao-mat">
                
                <i class="bx bx-light-bulb-alt" style="color:#ffffff;">
                </i>
            </a>
        </main>

       
        <footer class="camera-footer">
            <section class="modos-camera">
                <a href="video.html" class="link-modo">Vídeo</a>
                <span class="link-modo-ativo">Foto</span>
                <a href="mais.html" class="link-modo">Mais</a>
            </section>

            <section class="secao-foto">
                <div class="galeria">
                    <img src="https://picsum.photos/45/45" alt="galeria">
                </div>
                <button class="botao-foto"></button>

                <a href="selfie.html" class="flip-camera">
                    <i class="bx bx-rotate-ccw" style="color:#ffffff;"></i>
                </a>
            </section>

            <nav class="barra-navegacao">
                <span>
                    <i class="bx bx-menu" style="color:#ffffff;"></i>
                </span>
                <span>
                    <i class="bx bx-square" style="color:#ffffff;"></i>
                </span>
                <span>
                    <i class="bx bx-chevron-left" style="color:#ffffff;"></i>
                </span>
            </nav>
        </footer>
    </div>
<script src="./js/script.js"></script>
</body>
</html>
